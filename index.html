<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chapters Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 📚 Main Page -->
<div id="mainPage">
    <h1>Chapter List</h1>
    <ul>
        <li onclick="openChapter('Trsbook_pages-to-jpg-0010.jpg')">Chapter 1</li>
        <li onclick="openChapter('Trsbook_pages-to-jpg-0011.jpg')">Chapter 2</li>
    </ul>
</div>

<!-- 🖼 Viewer Page -->
<div id="viewer" class="hidden">
    <div class="top-bar">
        <button onclick="goBack()">⬅ Back</button>
        <div class="controls">
            <button onclick="zoomIn()">➕</button>
            <button onclick="zoomOut()">➖</button>
            <button onclick="resetZoom()">🔄</button>
        </div>
    </div>

    <div class="image-container">
        <img id="chapterImage" src="">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
